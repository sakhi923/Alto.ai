<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="hGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="70%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <!-- Background orbit -->
  <path d="M 28 58 C 22 52, 24 42, 42 36 C 68 28, 92 34, 102 46 C 106 50, 104 56, 96 61" stroke="url(#orbitGrad)" stroke-width="7" stroke-linecap="round" stroke-opacity="0.65" />
  <!-- Left Pillar -->
  <rect x="28" y="26" width="18" height="68" rx="9" fill="url(#hGrad)" />
  <!-- Right Pillar -->
  <rect x="68" y="24" width="18" height="70" rx="9" fill="url(#hGrad)" />
  <!-- Bar -->
  <rect x="36" y="50" width="42" height="18" rx="5" fill="url(#hGrad)" />
  <!-- Front orbit -->
  <path d="M 16 68 C 14 74, 20 80, 36 80 C 58 80, 84 66, 100 50 C 104 46, 103 40, 96 38" stroke="url(#orbitGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 17 68 C 15 73, 22 79, 36 79 C 57 79, 83 65, 99 50" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8" />
  <!-- Sparkle star -->
  <g transform="translate(90, 16)">
    <path d="M 10 0 Q 10 10 20 10 Q 10 10 10 20 Q 10 10 0 10 Q 10 10 10 0 Z" fill="url(#sparkleGrad)" />
  </g>
</svg>
